<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Você recebeu moedas</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1E1B2E;
        }

        .wrapper {
            width: 100%;
            padding: 32px 16px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .header {
            background: linear-gradient(135deg, #6C4DFF, #A78BFA);
            padding: 32px 24px;
            text-align: center;
        }

        .header img {
            width: 200px;
        }

        .body {
            padding: 32px;
        }

        .body h1 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .body p {
            font-size: 15px;
            line-height: 1.6;
            color: #374151;
        }

        .coins-box {
            background-color: #F3F4F6;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin: 24px 0;
        }

        .coins {
            font-size: 36px;
            font-weight: bold;
            color: #6C4DFF;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #9CA3AF;
        }
    </style>
</head>

<body>
<div class="wrapper">
    <div class="container">

        <div class="header">
            <img src="cid:coinly-logo" alt="Coinly Logo">
        </div>

        <div class="body">

            <h1>Parabéns, <span th:text="${nome}">Aluno</span> 🎉</h1>

            <p>Você recebeu novas moedas no <strong>Coinly</strong>.</p>

            <div class="coins-box">
                <div class="coins">
                    +<span th:text="${quantidade}">100</span> moedas
                </div>
            </div>

            <p>
                Continue participando e acumulando moedas para trocar por vantagens e recompensas.
            </p>

        </div>

        <div class="footer">
            © Coinly — Recompensando seu esforço.
        </div>

    </div>
</div>
</body>
</html>
