<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova vantagem resgatada</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .wrapper {
            padding: 32px 16px;
        }

        .container {
            max-width: 560px;
            margin: auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #6C4DFF, #A78BFA);
            text-align: center;
            padding: 32px;
        }

        .header img {
            width: 200px;
        }

        .body {
            padding: 32px;
        }

        .info-box {
            background: #F3F4F6;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }

        .item {
            margin-bottom: 12px;
        }

        .label {
            font-size: 12px;
            color: #6B7280;
            text-transform: uppercase;
        }

        .value {
            font-weight: bold;
            color: #1E1B2E;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #9CA3AF;
        }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="container">

        <div class="header">
            <img src="cid:coinly-logo" alt="Coinly Logo">
        </div>

        <div class="body">

            <h1>Nova vantagem resgatada 📢</h1>

            <p>Um aluno realizou o resgate de uma vantagem.</p>

            <div class="info-box">

                <div class="item">
                    <div class="label">Aluno</div>
                    <div class="value" th:text="${aluno}">Aluno</div>
                </div>

                <div class="item">
                    <div class="label">Vantagem</div>
                    <div class="value" th:text="${vantagem}">Vantagem</div>
                </div>

                <div class="item">
                    <div class="label">Código</div>
                    <div class="value" th:text="${codigo}">ABC123</div>
                </div>

            </div>

        </div>

        <div class="footer">
            © Coinly — Recompensando seu esforço.
        </div>

    </div>
</div>

</body>
</html>
