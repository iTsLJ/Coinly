<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cupom de Resgate</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .wrapper {
            padding: 32px 16px;
        }

        .container {
            max-width: 560px;
            margin: auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #6C4DFF, #A78BFA);
            text-align: center;
            padding: 32px;
        }

        .header img {
            width: 200px;
        }

        .body {
            padding: 32px;
        }

        .coupon {
            margin: 24px 0;
            background: #F3F4F6;
            border: 2px dashed #6C4DFF;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .code {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #6C4DFF;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #9CA3AF;
        }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="container">

        <div class="header">
            <img src="cid:coinly-logo" alt="Coinly Logo">
        </div>

        <div class="body">

            <h1>Seu cupom foi gerado 🎟️</h1>

            <p>
                Você realizou o resgate da vantagem:
                <strong th:text="${vantagem}">Vantagem</strong>
            </p>

            <div class="coupon">
                <div class="code" th:text="${codigo}">
                    
                </div>
            </div>

            <p>Apresente este código ao parceiro para utilizar sua vantagem.</p>

        </div>

        <div class="footer">
            © Coinly — Recompensando seu esforço.
        </div>

    </div>
</div>

</body>
</html>
