spring:
  application:
    name: coinly-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/coinly}
    username: ${DB_USERNAME:coinly}
    password: ${DB_PASSWORD:coinly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:coinly}
    password: ${RABBITMQ_PASSWORD:coinly}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          multiplier: 2.0

coinly:
  mail:
    from: noreply@coinly.local
  admin:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
    nome: ${ADMIN_NOME:}
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-secret-of-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
